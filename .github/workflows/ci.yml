name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4.2.2
      - name: Set up Python 3.12
        uses: actions/setup-python@v7 # v5.2.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v4 # v4.2.0
        with:
          version: "latest"
      - name: Install dev dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Run ruff linter
        run: ruff check backend/
      - name: Run ruff formatter check
        run: ruff format --check backend/

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4.2.2
      - name: Set up Python 3.12
        uses: actions/setup-python@v7 # v5.2.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v4 # v4.2.0
        with:
          version: "latest"
      - name: Install dev dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Run mypy
        run: mypy backend/app/

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: snitchroot
          POSTGRES_PASSWORD: snitchroot_test
          POSTGRES_DB: snitchroot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://snitchroot:snitchroot_test@localhost:5432/snitchroot_test
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
      LOG_LEVEL: WARNING
      STRIPE_RESTRICTED_KEY: rk_test_placeholder_ci_do_not_use
      STRIPE_WEBHOOK_SECRET: whsec_placeholder_ci_do_not_use
      SECRET_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    steps:
      - uses: actions/checkout@v4 # v4.2.2
      - name: Set up Python 3.12
        uses: actions/setup-python@v7 # v5.2.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v4 # v4.2.0
        with:
          version: "latest"
      - name: Install dev dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Run pytest with coverage
        run: pytest
      - name: Upload coverage report
        uses: codecov/codecov-action@v4 # v4.6.0
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4.2.2
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  secret-scan:
    name: Secret Scan (detect-secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4.2.2
      - name: Set up Python 3.12
        uses: actions/setup-python@v7 # v5.2.0
        with:
          python-version: "3.12"
      - name: Install detect-secrets
        run: pip install detect-secrets
      - name: Scan for secrets
        run: detect-secrets scan --baseline .secrets.baseline backend/

  pip-audit:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4.2.2
      - name: Set up Python 3.12
        uses: actions/setup-python@v7 # v5.2.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v4 # v4.2.0
        with:
          version: "latest"
      - name: Install runtime dependencies
        run: uv pip install --system -e .
      - name: Audit installed packages
        run: |
          pip install pip-audit
          pip freeze > /tmp/requirements-frozen.txt
          IGNORE_ARGS=()
          while IFS= read -r line; do
            case "$line" in
              CVE-*)
                vuln_id="${line%%#*}"
                vuln_id="${vuln_id%% *}"
                IGNORE_ARGS+=(--ignore-vuln "$vuln_id")
                ;;
            esac
          done < .pip-audit-ignore
          pip-audit --requirement /tmp/requirements-frozen.txt --desc on "${IGNORE_ARGS[@]}"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4.2.2
      - name: Set up Python 3.12
        uses: actions/setup-python@v7 # v5.2.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v4 # v4.2.0
        with:
          version: "latest"
      - name: Install dev dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Run security rules
        run: ruff check --select S backend/app/
