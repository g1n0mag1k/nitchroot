[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snitchroot-cli"
version = "0.1.0"
description = "SnitchRoot command-line interface"
requires-python = ">=3.12"
dependencies = [
    "snitchroot",
    "typer>=0.12.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "respx>=0.21.0",
]

[project.scripts]
snitchroot = "snitchroot_cli.main:run"

[tool.uv.sources]
snitchroot = { path = "..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["snitchroot_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S"]
