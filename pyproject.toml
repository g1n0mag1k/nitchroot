[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snitchroot"
version = "0.1.0"
description = "Zero-friction payment rail sentry and automated ledger reconciliation sentinel"
authors = [{ name = "Andrew Rogers", email = "rogersandy90@gmail.com" }]
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "stripe>=11.0.0",
    "reportlab>=4.2.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.4",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "redis[hiredis]>=5.2.0",
    "structlog>=24.4.0",
    "cryptography>=43.0.0",
    "tenacity>=9.0.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "respx>=0.21.0",
    "faker>=30.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-redis>=4.6.0",
    "types-reportlab>=4.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E","W","F","I","B","C4","UP","N","ANN","S","RUF"]
ignore = ["ANN101","ANN102","S101"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["ANN", "S"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["stripe.*", "reportlab.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
addopts = [
    "--cov=backend/app",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=85",
    "-v",
]

[tool.coverage.run]
source = ["backend/app"]
omit = ["*/__init__.py", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
